<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight booking study</title>
  <script src="lib/jspsych-8.3.0.min.js"></script>
  <script src="lib/plugin-survey-4.0.0.min.js"></script>
  <script src="lib/plugin-call-function-2.1.0.min.js"></script>
  <script src="lib/plugin-pipe-0.6.0.min.js"></script>
  <link rel="stylesheet" href="lib/jspsych-8.3.0.css">
  <link rel="stylesheet" href="lib/plugin-survey-4.0.0.min.css">
  <style>
    body { background: #f3f3f3; font-family: "Open Sans", Arial, sans-serif; }
    .jspsych-content { max-width: 900px; text-align: left; }
    .card { border: 1px solid #d0d7de; border-radius: 8px; padding: 14px 16px; background: #fff; margin: 8px 0 4px; }
    .kind { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; }
    .attr-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 4px; }
    .sd-html .attr-name, .sd-html .attr-price, .attr-name, .attr-price { font-size: 20px; font-weight: 700; color: #111827; }
    .attr-price { white-space: nowrap; }
    .attr-text { margin-top: 6px; color: #374151; }
    .airline { margin-bottom: 4px; color: #374151; }
    .summary { background: #fafafa; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; }
    .summary-title { font-size: 13px; font-weight: 600; color: #4b5563; margin-bottom: 6px; }
    .ptable { width: 100%; border-collapse: collapse; font-size: 14px; }
    .ptable td { padding: 4px 6px; border-top: 1px solid #eee; vertical-align: top; }
    .ptable td:last-child { text-align: right; }
    .ptable tr.current td { background: #fff4c2; font-weight: 600; }
    .opt { color: #6b7280; font-weight: normal; font-size: 12px; }
    .total { margin: 10px 0; font-size: 15px; }
    .note { color: #92400e; font-weight: 600; }
    .scenario p { line-height: 1.5; }
  </style>
</head>
<body>
  <script src="study1.js"></script>
</body>
</html>
